---
# Installer k3s et récupérer un kubeconfig utilisable en local.

- name: Vérifier si k3s est déjà installé
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Télécharger et installer k3s (script officiel)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - \
      --write-kubeconfig-mode 644
  when: not k3s_binary.stat.exists
  # Traefik est activé par défaut dans k3s (ingress) — ne pas le désactiver ici.
  # Le servicelb intégré gère l'exposition des services de type LoadBalancer sur le réseau local.
  # TODO (V2) : envisager --disable servicelb si un LoadBalancer externe (MetalLB) est préféré.

- name: Attendre que le noeud soit Ready
  ansible.builtin.command: k3s kubectl get node -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 18
  delay: 10
  changed_when: false

- name: Récupérer le kubeconfig généré
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_raw

- name: Créer le répertoire kubeconfig local si nécessaire
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_local_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Copier le kubeconfig en local (poste de pilotage) avec l'IP réelle du noeud
  ansible.builtin.copy:
    content: "{{ (kubeconfig_raw.content | b64decode) | replace('127.0.0.1', ansible_host) }}"
    dest: "{{ k3s_kubeconfig_local_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
