---
# Rôle : ad_domain_controller
# Prérequis :
#   - VM Windows Server 2022 clonée depuis le template Packer (vm_id 9001)
#   - WinRM HTTPS (port 5986) configuré par le script 03-finalize.ps1 de Packer
#   - Variables ad_domain_name, ad_domain_netbios_name, ad_safe_mode_admin_password
#     définies dans group_vars/all.yml (voir group_vars/all.yml.example)
# Collections requises : ansible.windows, microsoft.ad (voir ansible/requirements.yml)

- name: "AD | Étape 1 — Installer AD Domain Services"
  ansible.builtin.include_tasks: 01_install_adds.yml
  tags: [ad, ad_install]

- name: "AD | Étape 2 — Promouvoir en contrôleur de domaine"
  ansible.builtin.include_tasks: 02_promote_dc.yml
  tags: [ad, ad_promote]

- name: "AD | Étape 3 — Créer la structure d'OUs"
  ansible.builtin.include_tasks: 03_ou_structure.yml
  tags: [ad, ad_ou]

- name: "AD | Étape 4 — Créer les groupes de sécurité"
  ansible.builtin.include_tasks: 04_groups.yml
  tags: [ad, ad_groups]

- name: "AD | Étape 5 — Créer les utilisateurs"
  ansible.builtin.include_tasks: 05_users.yml
  tags: [ad, ad_users]
