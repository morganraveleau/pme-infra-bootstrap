---
# Déployer une stack front+back+bdd de démo dans k3s via Traefik (ingress).

- name: Créer le namespace applicatif
  kubernetes.core.k8s:
    name: webapp
    api_version: v1
    kind: Namespace
    state: present
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Déployer PostgreSQL + l'application de démo
  kubernetes.core.k8s:
    state: present
    namespace: webapp
    # kubernetes.core.k8s ne traite pas les templates Jinja2 via "src:" ;
    # on utilise le filtre "template" pour interpréter les variables Ansible avant envoi.
    definition: "{{ lookup('template', role_path + '/templates/webapp-stack.yml.j2') | from_yaml_all | list }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

